name: Late connect (Strom receiver)

# The AC1 reproduction of #111 (Eyevinn/strom#1277), run against the pinned Strom:
# examples/late_connect.rs with `--receiver strom`, four times, on two local Stroms
# (the sender on :8080, the receiver on :8092, as in svensson00's Strom-only
# reproduction on strom#1277):
#
#   1. late:    the receiver flow starts 35 s after the uplink, sinks `sync: true`
#   2. first:   the receiver flow is up before the uplink starts
#   3. nosync:  late as in 1, sinks `sync: false`
#   4. late+restart: late as in 1, with `--restart-on-late-connect`: the ingest-side
#      workaround #111's triage proposed (restart the uplink once at a late first
#      connect, so it connects again into the running receiver). On Strom v0.8.2 it
#      did not avoid the stall (PR #170, run 45490377672), so it is kept as a recorded
#      negative result, and `up` has no such restart
#
# On Strom v0.8.4 (PR #171, runs 45500947777, 45517536044, 45518995136) both late
# rows are intermittent: run 1 (late) went PASS / PASS / FAIL, and in its FAIL the
# receiver stalled with the strom#1277 signature (drops from about +20 to +40 s, sinks
# empty until +40 s); run 4 (late+restart) went FAIL / PASS / PASS. strom#1277 is
# therefore not fixed in v0.8.4, only less frequent. Runs 2-3 (the controls) must
# PASS. Runs 1 and 4 are recorded, not gated: PASS or FAIL both count, and the summary
# says which it was. A run with no verdict still fails the job: an ERROR, a missing
# run, or run 4 without its restart line. No retries or voting: a vote over an
# intermittent stall still gives no fixed expectation. Runs 1 and 4 go back to a hard
# PASS only after a Strom release with a strom#1277 fix is pinned
# (.github/scripts/bump-strom-pin.sh) and shows both clean across several
# consecutive runs, not one.
#
# The Strom setup is ci.yml's real-strom job: GStreamer from apt, the
# strom-<tag>-linux-x86_64 release asset at the strom-types pin in Cargo.toml,
# checked against GitHub's SHA-256 digest. No secrets.
#
# Not part of every CI run (about 7 minutes of live media): by hand, or on a pull
# request that changes this workflow, the example or Cargo.toml (where the Strom pin
# lives, so a pin bump runs the reproduction against the new Strom on both ends).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/late-connect-strom.yml
      - examples/late_connect.rs
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: late-connect-strom-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  late-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENDER_STROM_PORT: "8080"
      RECEIVER_STROM_PORT: "8092"
      GST_GL_PLATFORM: egl
      GST_GL_WINDOW: surfaceless
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Install the GStreamer runtime and plugins
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 libgstreamer-gl1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libcairo2 \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri

      - name: Download Strom at the strom-types pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The same pin Cargo.toml, build.rs, build-macos-app.sh and ci.yml use.
          tag="$(sed -n 's/^strom-types = .*tag = "\([^"]*\)".*/\1/p' Cargo.toml)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "cannot read the strom-types tag from Cargo.toml (got '$tag')"; exit 1; }
          asset="strom-$tag-linux-x86_64"
          echo "Strom $tag ($asset), from the strom-types pin in Cargo.toml"
          release="$RUNNER_TEMP/strom-release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Eyevinn/strom/releases/tags/$tag" -o "$release"
          url="$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .browser_download_url' "$release")"
          digest="$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .digest // empty' "$release")"
          [[ -n "$url" ]] || { echo "Strom $tag has no asset $asset"; exit 1; }
          [[ "$digest" == sha256:* ]] || { echo "GitHub records no SHA-256 digest for $asset"; exit 1; }
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/strom" "$url"
          got="$(sha256sum "$bin/strom" | awk '{print $1}')"
          [[ "sha256:$got" == "$digest" ]] \
            || { echo "$asset: SHA-256 $got does not match the release ($digest)"; exit 1; }
          echo "SHA-256 OK: $got"
          chmod +x "$bin/strom"
          echo "$bin" >> "$GITHUB_PATH"
          echo "STROM_TAG=$tag" >> "$GITHUB_ENV"

      # Built before Strom starts, so the compile does not eat into the runs.
      - name: Build and unit-test the example
        run: |
          set -euo pipefail
          cargo build --example late_connect
          cargo test --example late_connect

      - name: Start the sending and the receiving Strom
        run: |
          set -euo pipefail
          strom --version || true
          for role in sender receiver; do
            if [[ "$role" == sender ]]; then port="$SENDER_STROM_PORT"; else port="$RECEIVER_STROM_PORT"; fi
            data="$RUNNER_TEMP/strom-$role"
            log="$RUNNER_TEMP/strom-$role.log"
            mkdir -p "$data"
            nohup strom --headless --port "$port" --data-dir "$data" >"$log" 2>&1 &
            pid=$!
            echo "$pid" > "$RUNNER_TEMP/strom-$role.pid"
            ready=false
            for _ in $(seq 1 90); do
              if ! kill -0 "$pid" 2>/dev/null; then echo "the $role Strom exited"; cat "$log"; exit 1; fi
              if curl -fsS -m 5 "http://127.0.0.1:$port/api/version" >/dev/null 2>&1; then ready=true; break; fi
              sleep 1
            done
            $ready || { echo "the $role Strom did not answer within 90s"; cat "$log"; exit 1; }
            echo "$role Strom on :$port: $(curl -fsS -m 5 "http://127.0.0.1:$port/api/version")"
          done

      - name: Run late / first / nosync / late+restart
        run: |
          # No errexit (the default shell runs `bash -e`): a run that FAILs exits 1,
          # and the next runs must still go.
          set +e -uo pipefail
          out="$RUNNER_TEMP/late-connect"
          mkdir -p "$out"
          bin="target/debug/examples/late_connect"
          common=(--strom "http://127.0.0.1:$SENDER_STROM_PORT"
                  --receiver strom --receiver-strom "http://127.0.0.1:$RECEIVER_STROM_PORT"
                  --window 60)
          # name | SRT port | extra arguments
          runs=(
            "late|47201|--listener-delay 35"
            "first|47202|--listener-delay 0"
            "nosync|47203|--listener-delay 35 --receiver-sync false"
            "late+restart|47204|--listener-delay 35 --restart-on-late-connect"
          )
          : > "$out/results.tsv"
          for spec in "${runs[@]}"; do
            IFS='|' read -r name port extra <<<"$spec"
            echo "::group::run $name: late_connect ${common[*]} --port $port $extra"
            # shellcheck disable=SC2086 # $extra is a list of arguments
            "$bin" "${common[@]}" --port "$port" $extra 2>&1 | tee "$out/$name.log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            # The verdict is the example's own last PASS/FAIL line, not its exit
            # status: an error (Strom refusing a flow, no peer) also exits 1, and
            # must not count as the expected FAIL.
            if grep -q '^PASS:' "$out/$name.log" && [[ "$status" == 0 ]]; then
              verdict=PASS
            elif grep -q '^FAIL:' "$out/$name.log" && [[ "$status" == 1 ]]; then
              verdict=FAIL
            else
              verdict=ERROR
            fi
            # late+restart tests the restart: without its restart line in the log
            # (the first peer came in time, so nothing restarted) the run did not
            # test it, and its verdict, FAIL or PASS, must not count.
            if [[ "$name" == late+restart && "$verdict" != ERROR ]] \
                && ! grep -q '^late connect: first peer .*restarting the uplink once' "$out/$name.log"; then
              echo "run $name: no restart line in its log, so it did not exercise the restart"
              verdict=ERROR
            fi
            echo "run $name: $verdict (exit status $status)"
            printf '%s\t%s\t%s\t%s\n' "$name" "$extra" "$verdict" "$status" >> "$out/results.tsv"
          done

      - name: Results
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/late-connect"
          results="$out/results.tsv"
          summary="$out/summary.md"
          # The expectations on Strom v0.8.4, see the header. `PASS or FAIL` takes
          # either verdict, but not ERROR or NOT RUN. The messages below are built from
          # this array, so they follow it.
          order=(late first nosync late+restart)
          declare -A expected=([late]="PASS or FAIL" [first]=PASS [nosync]=PASS [late+restart]="PASS or FAIL")
          pattern=""
          for name in "${order[@]}"; do pattern+="${pattern:+ / }${expected[$name]}"; done
          declare -A got=()
          ok=true
          {
            echo "## Late connect (Strom receiver), #111 / strom#1277"
            echo
            echo "Strom ${STROM_TAG:-unknown} (strom-types pin) on both ends, sender :$SENDER_STROM_PORT, receiver :$RECEIVER_STROM_PORT, window 60 s, commit \`$HEAD_SHA\`."
            echo
            echo "| run | arguments | expected | result |"
            echo "|---|---|---|---|"
            for name in "${order[@]}"; do
              # An exact match on the name column: `late+restart` is not a regex.
              line="$(awk -F'\t' -v n="$name" '$1 == n' "$results" 2>/dev/null || true)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r _ extra verdict status <<<"$line"
              else
                extra="-"; verdict="NOT RUN"; status="-"
              fi
              got[$name]="$verdict"
              case "${expected[$name]}" in
                "PASS or FAIL") [[ "$verdict" == PASS || "$verdict" == FAIL ]] || ok=false ;;
                *) [[ "$verdict" == "${expected[$name]}" ]] || ok=false ;;
              esac
              echo "| $name | \`--receiver strom $extra\` | ${expected[$name]} | $verdict (exit $status) |"
            done
            echo
            if $ok; then
              echo "Pattern $pattern as expected: both controls (\`first\`, \`nosync\`) are clean, and every run gave a verdict."
              echo
              # The v0.8.4 run where each recorded row FAILed (see the header).
              declare -A failed_in=([late]=45518995136 [late+restart]=45500947777)
              for name in late late+restart; do
                if [[ "${got[$name]}" == FAIL ]]; then
                  echo "- \`$name\`: FAIL, stalled this time, strom#1277 not fixed in this Strom."
                else
                  echo "- \`$name\`: PASS, clean this time; intermittent on v0.8.4 (it FAILed in run ${failed_in[$name]}), not counted as fixed."
                fi
              done
            else
              echo "**Pattern differs from the expected $pattern.** Only a \`first\` or \`nosync\` FAIL is a regression (a control stalls: in this Strom, or in the reproduction). An ERROR or NOT RUN means a run gave no verdict: see its log."
            fi
            echo
            for name in "${order[@]}"; do
              [[ -f "$out/$name.log" ]] || continue
              echo "<details><summary>$name: samples and verdict</summary>"
              echo
              echo '```text'
              grep -E '^ *(connected|\+[0-9]+ s|since connect|receiver|the caller|listener|control|late peer|late connect|first peer|PASS|FAIL)' "$out/$name.log" || true
              echo '```'
              echo
              echo "</details>"
            done
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary"
          $ok || { echo "::error title=late-connect::the pattern is not the expected $pattern, see the job summary"; exit 1; }

      - name: Stop Strom, logs (tail)
        if: always()
        run: |
          for role in sender receiver; do
            pidfile="$RUNNER_TEMP/strom-$role.pid"
            if [[ -f "$pidfile" ]]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
            log="$RUNNER_TEMP/strom-$role.log"
            echo "=== $role Strom log (tail) ==="
            if [[ -f "$log" ]]; then
              tail -n 150 "$log"
              cp "$log" "$RUNNER_TEMP/late-connect/" 2>/dev/null || true
            else
              echo "no log"
            fi
          done

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-connect-strom
          path: ${{ runner.temp }}/late-connect/
          if-no-files-found: ignore
