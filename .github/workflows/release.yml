name: Release

# Pushing a tag such as v0.3.0 builds one binary per platform (a tarball each, a
# zip for Windows) and attaches them to a GitHub release, with SHA256SUMS and
# build-provenance attestations (`release`). When the Apple secrets (#25) exist and
# the macOS DMG was notarized, `release-macos` then adds the DMG to that release,
# rewrites SHA256SUMS to cover it and attests it; otherwise it is skipped and the
# release is the archives only. The manual trigger builds the same artifacts and
# SHA256SUMS without publishing anything, to try the workflow out. A pull request
# that changes this workflow, the macOS app script, the desktop app (app/) or the
# packaging (packaging/) runs it too, so the change is proven before it merges; like
# a manual run from a branch, it publishes nothing (`release` and `release-macos` run
# only on a tag ref).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/build-macos-app.sh
      - .github/scripts/open-live-ingest.entitlements
      - app/**
      - packaging/**

env:
  CARGO_TERM_COLOR: always
  BIN: open-live-ingest
  DMG: open-live-ingest-macos-aarch64.dmg
  # The artifact name of a notarized DMG on a tag ref; only `release-macos` reads it.
  NOTARIZED_DMG_ARTIFACT: notarized-macos-dmg

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so every step is the same script on every runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      # The tag must name the version Cargo.toml carries, so a release never ships a
      # binary that reports a different version than its filename. Cargo itself reads
      # it: the version is the workspace's, inherited by the open-live-ingest package.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "open-live-ingest") | .version')"
          test "$crate" = "${{ github.ref_name }}" \
            || { echo "tag ${{ github.ref_name }} but Cargo.toml says $crate"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl gives a static binary that runs on any Linux distribution. The only C in
      # the build is ring's, which needs a musl-aware compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The desktop app (app/, docs/specs/desktop-app.md) on the two platforms it ships
      # on. The workspace's default members are the gateway only, so it needs its own
      # -p. Its artifact name must not start with "$BIN-": `checksums` and `release`
      # pick the archives up by that prefix, and the app binary is not a release asset
      # of its own. `macos-app` puts it in the DMG as the bundle's main executable.
      - name: Build the desktop app
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cargo build --release --locked -p open-live-ingest-app --target ${{ matrix.target }}
          case "${{ matrix.target }}" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          echo "APP_BINARY=target/${{ matrix.target }}/release/open-live-ingest-app$exe" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        with:
          name: app-binary-${{ matrix.target }}
          path: ${{ env.APP_BINARY }}
          if-no-files-found: error

      # No version in the asset name, so releases/latest/download/<asset> is a stable
      # URL. The tag names the version; so does the binary. Windows gets a zip (7-Zip
      # is preinstalled on the runner), the rest a tarball, same folder layout.
      - name: Package
        run: |
          name="$BIN-${{ matrix.target }}"
          mkdir "$name"
          case "${{ matrix.target }}" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          cp "target/${{ matrix.target }}/release/$BIN$exe" LICENSE-MIT LICENSE-APACHE README.md gateway.toml.example "$name/"
          if [ -n "$exe" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Runs on the manual trigger too, so a dry run shows the SHA256SUMS a release
  # would carry. It needs no write permission; publishing stays in `release`.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The archives of `build` only, by name pattern, never a DMG of macos-app.
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.tar.gz
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.zip
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only the archives of `build` and the SHA256SUMS of `checksums`, each by name.
      # Any other artifact of the run (the DMGs of macos-app) is never downloaded here,
      # so a re-run of this job cannot publish it.
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.tar.gz
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.zip
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: dist
      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      # Signed build provenance for each archive, checked with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Open Live Ingest.app for Apple silicon in a drag-to-install DMG, built from the
  # aarch64-apple-darwin binaries of `build` by .github/scripts/build-macos-app.sh: the
  # desktop app (artifact app-binary-aarch64-apple-darwin) is the bundle's main
  # executable, and the gateway CLI from the tarball sits next to it for SSH use. The
  # script bundles the Strom the strom-types tag in Cargo.toml names, so the workflow
  # never names a Strom version itself.
  #
  # Every Mach-O in the app is signed with the hardened runtime, and strom,
  # open-live-ingest and open-live-ingest-app with the entitlements in
  # .github/scripts/open-live-ingest.entitlements.
  # The identity depends on the repository secrets (#25):
  #   - APPLE_DEVELOPER_ID_P12 set: its Developer ID Application certificate is imported
  #     into a temporary keychain, which the last step deletes on every outcome, and the
  #     app and the DMG are signed with it and a secure timestamp.
  #   - not set (pull requests, and every run until #25 is done): both are signed ad hoc.
  #     The same hardened-runtime signing and checks run, so a signing or layout problem
  #     shows up now, but the DMG cannot be notarized.
  # Notarizing (notarytool, App Store Connect API key) and stapling run only when the
  # Developer ID certificate and all three APPLE_NOTARY_* secrets are there; otherwise
  # those steps are skipped. Secrets are read only through step env, never echoed.
  #
  # Only a notarized DMG reaches a release. The job output `notarized` is "true" only
  # when "Check the notarization" ran and passed, which needs the Developer ID
  # certificate and the notary key and means notarizing and stapling succeeded; it is
  # "false" on every other run (ad hoc signing, no secrets, any of those steps skipped).
  # Two uploads, each under its own artifact name:
  #   - ${DMG}: a manual run from a branch or a pull request run (workflow_dispatch or
  #     pull_request AND a non-tag ref), whatever the signing, to try the DMG out.
  #   - ${NOTARIZED_DMG_ARTIFACT}: a tag ref with notarized == "true", for `release-macos`.
  # On a tag ref an ad hoc DMG is uploaded under neither name, so nothing can publish
  # it. `release` downloads only the `build` archives by name pattern and never sees a
  # DMG, and `release-macos` runs only when notarized == "true".
  #
  # `release` does not wait for this job, and `release-macos` (which waits for both)
  # only adds to the release `release` created. A failure here or in `release-macos`
  # therefore never holds up or fails the tarballs, SHA256SUMS and attestations; it
  # leaves a release without the DMG, which a re-run of the failed jobs completes.
  macos-app:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      notarized: ${{ steps.notarization.outputs.notarized == 'true' }}
    env:
      TARGET: aarch64-apple-darwin
      APP: Open Live Ingest.app
      # "true" or "false"; secrets cannot be read in `if:` directly.
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && secrets.APPLE_NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}.tar.gz
          path: tarball
      - name: Unpack the gateway
        run: tar xzf "tarball/$BIN-$TARGET.tar.gz" -C tarball
      # An artifact does not keep the executable bit; the script installs it 0755.
      - uses: actions/download-artifact@v4
        with:
          name: app-binary-${{ env.TARGET }}
          path: app-binary

      # The GStreamer the bundle carries, plugins included; see the script's header.
      - name: Install GStreamer
        run: brew install gstreamer

      # A keychain of its own with a random password, first in the search list so
      # codesign finds the identity. KEYCHAIN is exported before anything that can
      # fail, so the cleanup step deletes it whatever happens next.
      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          kc_pw="$(openssl rand -hex 32)"
          echo "::add-mask::$kc_pw"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$kc_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pw" "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          base64 --decode <<<"$P12_BASE64" > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$keychain" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          pattern='"Developer ID Application: .*'
          if [[ -n "$TEAM_ID" ]]; then pattern+="\\($TEAM_ID\\)"; fi
          hash="$(grep -E "$pattern" <<<"$identities" | awk 'NR == 1 { print $2 }')"
          [[ -n "$hash" ]] || { echo "the certificate holds no valid Developer ID Application identity"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Signing with Developer ID identity $hash"

      - name: Say the build is signed ad hoc
        if: env.HAS_DEVELOPER_ID != 'true'
        run: echo "::notice title=Ad hoc signed::APPLE_DEVELOPER_ID_P12 is not set, so the app and the DMG are signed ad hoc (hardened runtime, no Developer ID). This DMG is not notarized; Gatekeeper rejects it once downloaded."

      # dmg-root becomes the DMG's volume: the app and an /Applications link. The script
      # signs with MACOS_SIGN_IDENTITY when the import step set it, ad hoc otherwise,
      # and fails unless every Mach-O carries the hardened runtime and the three
      # executables the camera and microphone entitlements.
      - name: Build and sign the app bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build-macos-app.sh "tarball/$BIN-$TARGET/$BIN" \
            app-binary/open-live-ingest-app dmg-root
          ln -s /Applications dmg-root/Applications

      # hdiutil on hosted runners sometimes fails with "Resource busy"; retry it.
      - name: Build the DMG
        run: |
          for attempt in 1 2 3; do
            hdiutil create -volname "Open Live Ingest" -srcfolder dmg-root \
              -fs HFS+ -format UDZO -ov "$DMG" && exit 0
            echo "hdiutil create failed (attempt $attempt)"
            if (( attempt < 3 )); then sleep 10; fi
          done
          exit 1

      - name: Sign the DMG
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_SIGN_KEYCHAIN" "$DMG"
          else
            echo "Signing $DMG ad hoc"
            codesign --force --sign - "$DMG"
          fi
          codesign --verify --strict --verbose=2 "$DMG"

      # The .p8 is written to a private directory and removed when the step ends; the
      # cleanup step removes it too if the runner is cut short.
      - name: Notarize the DMG
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          key="$dir/AuthKey.p8"
          # The secret is the base64 of the .p8 (#25); the PEM text itself works too.
          if [[ "$NOTARY_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          else
            base64 --decode <<<"$NOTARY_KEY_P8" > "$key"
          fi
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit "$DMG" "${auth[@]}" --wait --timeout 1h \
            --output-format json > "$dir/result.json" || true
          status="$(jq -r '.status // empty' "$dir/result.json" 2>/dev/null || true)"
          id="$(jq -r '.id // empty' "$dir/result.json" 2>/dev/null || true)"
          echo "notarytool: submission ${id:-<none>}, status ${status:-<none>}"
          if [[ "$status" != Accepted ]]; then
            if [[ -n "$id" ]]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "notarization did not succeed"; exit 1
          fi

      - name: Staple the notarization ticket
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        run: xcrun stapler staple "$DMG"

      # On every run, on the app as the DMG carries it, mounted away from the build path:
      # - build-macos-app.sh --check: CFBundleExecutable is open-live-ingest-app, with the
      #   CLI and strom next to it and the icon in Resources; no Mach-O load command or
      #   rpath names /opt/homebrew or /usr/local, every Mach-O has the hardened runtime,
      #   strom, open-live-ingest and open-live-ingest-app have the camera and
      #   microphone entitlements, and the strict deep codesign verify passes.
      # - the signature and entitlements of the main executable and the CLI, for the log.
      # - the app and the CLI start under the hardened runtime from the mounted DMG
      #   (dyld and library validation load them) and report the bundle's version.
      # - the bundled Strom reports 0.8.1 or later.
      # - the bundled Strom starts under the hardened runtime with the bundle's
      #   GStreamer, as the gateway starts it: the plugin scanner builds the registry,
      #   device discovery answers, and nothing in its log says a library or plugin
      #   failed to load (library validation, a bad signature).
      - name: Check the DMG
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          strom_pid=""
          trap 'if [[ -n "$strom_pid" ]]; then kill "$strom_pid" 2>/dev/null || true; fi; hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          test -d "$mnt/$APP" || { echo "$APP is missing from the DMG"; exit 1; }
          test "$(readlink "$mnt/Applications")" = /Applications \
            || { echo "the DMG has no /Applications link"; exit 1; }
          contents="$mnt/$APP/Contents"
          .github/scripts/build-macos-app.sh --check "$mnt/$APP"
          codesign -dv --entitlements - "$contents/MacOS/open-live-ingest-app"
          codesign -dv --entitlements - "$contents/MacOS/open-live-ingest"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$contents/Info.plist")"
          for exe in open-live-ingest-app open-live-ingest; do
            got="$("$contents/MacOS/$exe" --version)" \
              || { echo "$exe --version failed from the DMG"; exit 1; }
            echo "bundled $exe: $got"
            test "$got" = "$exe $bundle_version" \
              || { echo "expected '$exe $bundle_version' from $exe --version"; exit 1; }
          done
          otool -L "$contents/MacOS/strom"
          out="$("$contents/MacOS/strom" --version)"
          echo "bundled Strom: $out"
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$out" | head -n 1)"
          IFS=. read -r major minor patch <<<"$version"
          if [[ -z "$version" ]] || (( major == 0 && (minor < 8 || (minor == 8 && patch < 1)) )); then
            echo "the bundled Strom must be 0.8.1 or later (got '$out')"; exit 1
          fi

          data="$RUNNER_TEMP/strom-data"
          mkdir -p "$data"
          log="$data/strom.log"
          port=18080
          GST_PLUGIN_SYSTEM_PATH_1_0="$contents/PlugIns/gstreamer" \
          GST_PLUGIN_SYSTEM_PATH="$contents/PlugIns/gstreamer" \
          GST_PLUGIN_PATH_1_0="" GST_PLUGIN_PATH="" \
          GST_PLUGIN_SCANNER_1_0="$contents/Helpers/gst-plugin-scanner" \
          GST_PLUGIN_SCANNER="$contents/Helpers/gst-plugin-scanner" \
          GST_REGISTRY_1_0="$data/gstreamer-registry.bin" \
          GST_REGISTRY="$data/gstreamer-registry.bin" \
          GST_DEBUG="*:2" \
            "$contents/MacOS/strom" --headless --port "$port" --data-dir "$data" >"$log" 2>&1 &
          strom_pid=$!
          ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$strom_pid" 2>/dev/null; then echo "the bundled Strom exited"; cat "$log"; exit 1; fi
            if curl -fsS -m 5 "http://127.0.0.1:$port/api/version" >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          $ready || { echo "the bundled Strom did not answer within 90s"; cat "$log"; exit 1; }
          echo "Strom version API: $(curl -fsS -m 5 "http://127.0.0.1:$port/api/version")"
          devices="$(curl -fsS -m 60 "http://127.0.0.1:$port/api/discovery/devices?category=video_source")" \
            || { echo "device discovery failed"; cat "$log"; exit 1; }
          echo "Strom device discovery: $devices"
          kill "$strom_pid"; wait "$strom_pid" || true; strom_pid=""
          echo "--- strom log (tail) ---"; tail -n 60 "$log"
          test -s "$data/gstreamer-registry.bin" \
            || { echo "the bundled Strom built no GStreamer registry"; exit 1; }
          if grep -nE 'not valid for use in process|Library Validation|Failed to load plugin|code signature|Code Signature' "$log"; then
            echo "the bundled Strom could not load bundled code under the hardened runtime"; exit 1
          fi
          echo "OK: the bundled Strom runs under the hardened runtime and loads the bundle's GStreamer"

      # The last line is what sets the job output `notarized`: it is reached only when
      # notarizing, stapling and both checks here succeeded.
      - name: Check the notarization
        id: notarization
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t install "$DMG"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && github.ref_type != 'tag'
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Upload the notarized DMG for the release
        if: github.ref_type == 'tag' && steps.notarization.outputs.notarized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOTARIZED_DMG_ARTIFACT }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Remove the temporary keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/developer-id.p12"
          if [[ -n "${KEYCHAIN:-}" && -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
            echo "Deleted the temporary keychain"
          else
            echo "No temporary keychain to delete"
          fi

  # Adds the notarized DMG to the release `release` created: the DMG itself, a
  # SHA256SUMS that covers the release's tarballs, the Windows zip and the DMG
  # (replacing the one `release` uploaded), and a build-provenance attestation for the DMG, checked with
  # `gh attestation verify open-live-ingest-macos-aarch64.dmg --repo Eyevinn/open-live-ingest`.
  # Skipped, not failed, when macos-app did not notarize (no Apple secrets) or failed,
  # or when `release` failed. The attestation is made before anything is uploaded, so
  # a DMG on a release always has one. Safe to re-run: it checksums the archives as
  # published and uploads with --clobber. --clobber replaces SHA256SUMS by deleting
  # and re-uploading it, so for a moment right after a release the file is missing.
  release-macos:
    if: github.ref_type == 'tag' && needs.macos-app.outputs.notarized == 'true'
    needs: [release, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.NOTARIZED_DMG_ARTIFACT }}
          path: dist
      - name: Checksums for the archives and the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s "dist/$DMG" || { echo "the notarized artifact holds no $DMG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip' --dir dist
          cd dist
          sha256sum -- *.tar.gz *.zip "$DMG" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ env.DMG }}
      - name: Add the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "dist/$DMG" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
