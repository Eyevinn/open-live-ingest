name: Release

# Pushing a tag such as v0.3.0 builds one static binary per platform and attaches
# them to a GitHub release. The manual trigger builds the same artifacts without
# publishing anything, to try the workflow out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: open-live-ingest

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version Cargo.toml carries, so a release never ships a
      # binary that reports a different version than its filename.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$crate" = "${{ github.ref_name }}" \
            || { echo "tag ${{ github.ref_name }} but Cargo.toml says $crate"; exit 1; }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl gives a static binary that runs on any Linux distribution. The only C in
      # the build is ring's, which needs a musl-aware compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # No version in the asset name, so releases/latest/download/<asset> is a stable
      # URL. The tag names the version; so does the binary.
      - name: Package
        run: |
          name="$BIN-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$BIN" LICENSE-MIT LICENSE-APACHE README.md gateway.toml.example "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      # Signed build provenance for each tarball, checked with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Open Live Ingest.app for Apple silicon in a drag-to-install DMG, built from the
  # aarch64-apple-darwin binary of `build` by .github/scripts/build-macos-app.sh. The
  # script bundles the Strom the strom-types tag in Cargo.toml names, so the workflow
  # never names a Strom version itself.
  #
  # The DMG is not signed yet, so it never reaches a release. It is uploaded as a
  # workflow artifact only on a manual run from a branch: the upload step is gated on
  # workflow_dispatch AND a non-tag ref. `release` runs on any tag ref, a manual run
  # from a tag included, and downloads every artifact of the run, so a DMG uploaded on
  # a tag ref could be published (e.g. by a re-run of `release`). On a tag ref this
  # job builds and checks the DMG but uploads nothing. `release` does not wait for
  # this job, so its tarballs, SHA256SUMS and attestations are what they were.
  macos-app:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      DMG: open-live-ingest-macos-aarch64.dmg
      APP: Open Live Ingest.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}.tar.gz
          path: tarball
      - name: Unpack the gateway
        run: tar xzf "tarball/$BIN-$TARGET.tar.gz" -C tarball

      # The GStreamer the bundle carries, plugins included; see the script's header.
      - name: Install GStreamer
        run: brew install gstreamer

      # dmg-root becomes the DMG's volume: the app and an /Applications link.
      - name: Build the app bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build-macos-app.sh "tarball/$BIN-$TARGET/$BIN" dmg-root
          ln -s /Applications dmg-root/Applications

      # Signing placeholder (#27, needs the Apple secrets of #25). It goes here, before
      # the DMG is made: set MACOS_SIGN_IDENTITY on the step above (after importing the
      # Developer ID certificate into a temporary keychain) so the script signs the
      # bundle with the hardened runtime, then sign the DMG below, notarize it with
      # notarytool, staple it, and only then hand it to `release` with SHA256SUMS and
      # an attestation. Until then nothing here is published.

      # hdiutil on hosted runners sometimes fails with "Resource busy"; retry it.
      - name: Build the DMG
        run: |
          for attempt in 1 2 3; do
            hdiutil create -volname "Open Live Ingest" -srcfolder dmg-root \
              -fs HFS+ -format UDZO -ov "$DMG" && exit 0
            echo "hdiutil create failed (attempt $attempt)"
            if (( attempt < 3 )); then sleep 10; fi
          done
          exit 1

      # AC2, on the app as the DMG carries it, mounted away from the build path: no
      # Mach-O load command or rpath names /opt/homebrew or /usr/local (the script's
      # check covers MacOS/strom, MacOS/open-live-ingest and every bundled dylib), and
      # the bundled Strom reports 0.8.1 or later.
      - name: Check the DMG
        run: |
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          test -d "$mnt/$APP" || { echo "$APP is missing from the DMG"; exit 1; }
          test "$(readlink "$mnt/Applications")" = /Applications \
            || { echo "the DMG has no /Applications link"; exit 1; }
          .github/scripts/build-macos-app.sh --check "$mnt/$APP"
          otool -L "$mnt/$APP/Contents/MacOS/strom"
          out="$("$mnt/$APP/Contents/MacOS/strom" --version)"
          echo "bundled Strom: $out"
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$out" | head -n 1)"
          IFS=. read -r major minor patch <<<"$version"
          if [[ -z "$version" ]] || (( major == 0 && (minor < 8 || (minor == 8 && patch < 1)) )); then
            echo "the bundled Strom must be 0.8.1 or later (got '$out')"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error
