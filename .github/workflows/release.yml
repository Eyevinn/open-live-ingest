name: Release

# Pushing a tag such as v0.3.0 builds one binary per platform (a tarball each, a
# zip for Windows) and the Windows installer (`windows-app`), and attaches them to a
# GitHub release, with SHA256SUMS and build-provenance attestations (`release`). When the Apple secrets (#25) exist and
# the macOS DMG was notarized, `release-macos` then adds the DMG to that release,
# rewrites SHA256SUMS to cover it and attests it; otherwise it is skipped and the
# release is the archives only. The manual trigger builds the same artifacts and
# SHA256SUMS without publishing anything, to try the workflow out. A pull request
# that changes this workflow, the macOS app or Strom MSI script, the desktop app (app/) or the
# packaging (packaging/) runs it too, so the change is proven before it merges; like
# a manual run from a branch, it publishes nothing (`release` and `release-macos` run
# only on a tag ref).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/build-macos-app.sh
      - .github/scripts/e2e-app.py
      - .github/scripts/test_e2e_app.py
      - .github/scripts/fetch-strom-msi.sh
      - .github/scripts/open-live-ingest.entitlements
      - app/**
      - packaging/**

env:
  CARGO_TERM_COLOR: always
  BIN: open-live-ingest
  DMG: open-live-ingest-macos-aarch64.dmg
  # The artifact name of a notarized DMG on a tag ref; only `release-macos` reads it.
  NOTARIZED_DMG_ARTIFACT: notarized-macos-dmg

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so every step is the same script on every runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      # The tag must name the version Cargo.toml carries, so a release never ships a
      # binary that reports a different version than its filename. Cargo itself reads
      # it: the version is the workspace's, inherited by the open-live-ingest package.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "open-live-ingest") | .version')"
          test "$crate" = "${{ github.ref_name }}" \
            || { echo "tag ${{ github.ref_name }} but Cargo.toml says $crate"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl gives a static binary that runs on any Linux distribution. The only C in
      # the build is ring's, which needs a musl-aware compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The desktop app (app/, docs/specs/desktop-app.md) on the two platforms it ships
      # on. The workspace's default members are the gateway only, so it needs its own
      # -p. Its artifact name must not start with "$BIN-": `checksums` and `release`
      # pick the archives up by that prefix, and the app binary is not a release asset
      # of its own. `macos-app` puts it in the DMG as the bundle's main executable.
      - name: Build the desktop app
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cargo build --release --locked -p open-live-ingest-app --target ${{ matrix.target }}
          case "${{ matrix.target }}" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          echo "APP_BINARY=target/${{ matrix.target }}/release/open-live-ingest-app$exe" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        with:
          name: app-binary-${{ matrix.target }}
          path: ${{ env.APP_BINARY }}
          if-no-files-found: error

      # No version in the asset name, so releases/latest/download/<asset> is a stable
      # URL. The tag names the version; so does the binary. Windows gets a zip (7-Zip
      # is preinstalled on the runner), the rest a tarball, same folder layout.
      - name: Package
        run: |
          name="$BIN-${{ matrix.target }}"
          mkdir "$name"
          case "${{ matrix.target }}" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          cp "target/${{ matrix.target }}/release/$BIN$exe" LICENSE-MIT LICENSE-APACHE README.md gateway.toml.example "$name/"
          if [ -n "$exe" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Open Live Ingest for Windows: an NSIS installer next to the zip
  # (docs/specs/desktop-app.md, section 11.2), from the x86_64-pc-windows-msvc binaries
  # of `build` (the CLI from the zip, the desktop app from app-binary-<target>) and the
  # Strom MSI the strom-types tag in Cargo.toml names, so the workflow never names a
  # Strom version itself. packaging/windows/open-live-ingest.nsi is the script; its
  # header says what it installs and where.
  #
  # The MSI is checked against the SHA-256 digest GitHub records for it before makensis
  # runs, as install.ps1 does; no digest, no installer. makensis comes from the runner
  # image when it has one, otherwise from Chocolatey at NSIS_VERSION.
  #
  # Signing depends on the repository secrets (docs/specs/desktop-app.md, section 15 Q9):
  #   - all six AZURE_* secrets below set: Azure Trusted Signing (now Azure Artifact
  #     Signing) signs the app and the CLI before they go into the installer, then the
  #     installer, and the job fails unless all three carry a valid Authenticode
  #     signature.
  #   - not set (pull requests, and every run until a human adds them): nothing is
  #     signed and a notice says so. SmartScreen warns when the installer is run.
  # Secrets are read only through step inputs, never echoed.
  #
  # The smoke test runs on every run, on the installer as it is uploaded: a silent
  # install into %ProgramFiles%, both executables report the release version, the
  # Start menu shortcut points at the app, the Strom MSI put strom.exe at
  # %ProgramFiles%\Strom\bin, the app's window process is still running after 5 s and
  # WebView2 made its folder under %LOCALAPPDATA%\open-live-ingest\webview, then a silent
  # uninstall removes the app, the CLI, the shortcut and the Apps & features entry and
  # leaves Strom.
  #
  # The installer is a release asset of its own, published by `release` with the
  # archives, so it follows the same #36 go/no-go as the Windows zip and has no gate of
  # its own. Its artifact name starts with "$BIN-" and ends in "-setup.exe", the pattern
  # `checksums` and `release` pick it up by.
  windows-app:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      SETUP: open-live-ingest-x86_64-pc-windows-msvc-setup.exe
      # Chocolatey's nsis package, used only when the image has no makensis.
      NSIS_VERSION: "3.13.0"
      # "true" or "false"; secrets cannot be read in `if:` directly.
      HAS_TRUSTED_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}.zip
          path: zip
      - uses: actions/download-artifact@v4
        with:
          name: app-binary-${{ env.TARGET }}
          path: app-binary

      # stage/ is what the installer carries. The version is the workspace's in
      # Cargo.toml, which `build` has already checked against the tag on a tag ref.
      - name: Stage the files
        run: |
          set -euo pipefail
          7z x -ozip "zip/$BIN-$TARGET.zip" > /dev/null
          mkdir stage
          cp "zip/$BIN-$TARGET/$BIN.exe" app-binary/open-live-ingest-app.exe LICENSE-MIT LICENSE-APACHE stage/
          cp app/icons/AppIcon.ico stage/open-live-ingest.ico
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] \
            || { echo "cannot read the workspace version from Cargo.toml (got '$version')"; exit 1; }
          if [[ "${{ github.ref_type }}" == tag && "v$version" != "${{ github.ref_name }}" ]]; then
            echo "tag ${{ github.ref_name }} but Cargo.toml says $version"; exit 1
          fi
          {
            echo "VERSION=$version"
            echo "VERSION_QUAD=${BASH_REMATCH[0]}.0"
            echo "STAGE=$(cygpath -w "$PWD/stage")"
          } >> "$GITHUB_ENV"
          ls -l stage

      # The script reads the Strom version from the strom-types tag in Cargo.toml, so
      # this workflow never names one (tests/pins.rs).
      - name: Download the Strom MSI and check its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          msi="$(.github/scripts/fetch-strom-msi.sh strom)"
          {
            echo "STROM_MSI_NAME=$(basename "$msi")"
            echo "STROM_MSI=$(cygpath -w "$PWD/$msi")"
          } >> "$GITHUB_ENV"

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis --version $env:NSIS_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis $env:NSIS_VERSION failed ($LASTEXITCODE)" }
            $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $makensis) { throw "makensis.exe not found after installing NSIS $env:NSIS_VERSION" }
          }
          Write-Host "makensis: $makensis, $(& $makensis /VERSION)"
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign the app and the CLI
        if: env.HAS_TRUSTED_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files: |
            ${{ github.workspace }}\stage\open-live-ingest-app.exe
            ${{ github.workspace }}\stage\open-live-ingest.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Say the installer is unsigned
        if: env.HAS_TRUSTED_SIGNING != 'true'
        run: echo "::notice title=Unsigned::The Azure Trusted Signing secrets are not set, so the installer, the app and the CLI are not signed. SmartScreen warns when the installer is run."

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MAKENSIS -V3 -WX `
            "-DVERSION=$env:VERSION" "-DVERSION_QUAD=$env:VERSION_QUAD" "-DSTAGE=$env:STAGE" `
            "-DSTROM_MSI=$env:STROM_MSI" "-DSTROM_MSI_NAME=$env:STROM_MSI_NAME" `
            "-DOUTFILE=$env:GITHUB_WORKSPACE\$env:SETUP" `
            packaging\windows\open-live-ingest.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Get-Item -LiteralPath $env:SETUP | Format-List Name, Length

      - name: Sign the installer
        if: env.HAS_TRUSTED_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files: ${{ github.workspace }}\${{ env.SETUP }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures
        if: env.HAS_TRUSTED_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in "stage\open-live-ingest-app.exe", "stage\open-live-ingest.exe", $env:SETUP) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            Write-Host "$f : $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed ($($sig.Status): $($sig.StatusMessage))" }
          }

      - name: Smoke test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$Message) { Write-Host "::error::$Message"; exit 1 }
          $dir = Join-Path $env:ProgramFiles 'Open Live Ingest'
          $app = Join-Path $dir 'open-live-ingest-app.exe'
          $cli = Join-Path $dir 'open-live-ingest.exe'
          $uninstaller = Join-Path $dir 'uninstall.exe'
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Open Live Ingest.lnk'
          $strom = Join-Path $env:ProgramFiles 'Strom\bin\strom.exe'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\OpenLiveIngest'
          $webview = Join-Path $env:LOCALAPPDATA 'open-live-ingest\webview'
          $appLog = Join-Path $env:LOCALAPPDATA 'open-live-ingest\logs\app.log'

          # A clean runner, so the installer has to run the Strom MSI itself.
          if (Test-Path -LiteralPath $dir) { Fail "$dir exists before the install" }
          if (Test-Path -LiteralPath $strom) { Fail "$strom exists before the install, so the MSI would not be exercised" }

          Write-Host "--- silent install"
          $p = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE $env:SETUP) -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $msiLog = Join-Path $env:TEMP 'open-live-ingest-strom-msi.log'
            if (Test-Path -LiteralPath $msiLog) { Get-Content -LiteralPath $msiLog -Tail 80 }
            Fail "the silent install exited with $($p.ExitCode)"
          }
          foreach ($f in $app, $cli, $uninstaller, 'LICENSE-MIT', 'LICENSE-APACHE', 'open-live-ingest.ico') {
            $path = if ([IO.Path]::IsPathRooted($f)) { $f } else { Join-Path $dir $f }
            if (-not (Test-Path -LiteralPath $path)) { Fail "$path is missing after the install" }
          }
          Get-ChildItem -LiteralPath $dir | Format-Table Name, Length

          foreach ($exe in @(@($app, 'open-live-ingest-app'), @($cli, 'open-live-ingest'))) {
            $got = (& $exe[0] --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { Fail "$($exe[0]) --version exited with $LASTEXITCODE" }
            Write-Host "installed $($exe[1]): $got"
            if ($got -ne "$($exe[1]) $env:VERSION") { Fail "expected '$($exe[1]) $env:VERSION' from $($exe[0]) --version, got '$got'" }
          }

          if (-not (Test-Path -LiteralPath $shortcut)) { Fail "the Start menu shortcut $shortcut is missing" }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          Write-Host "shortcut: $($lnk.TargetPath), icon $($lnk.IconLocation)"
          if ($lnk.TargetPath -ne $app) { Fail "the shortcut points at '$($lnk.TargetPath)', not $app" }

          if (-not (Test-Path -LiteralPath $strom)) { Fail "strom.exe is not at $strom after the install" }
          # The MSI adds GStreamer to the machine PATH, which this step's PATH predates.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $stromVersion = (& $strom --version 2>&1 | Out-String).Trim()
          Write-Host "Strom at the MSI path: $stromVersion (exit code $LASTEXITCODE)"

          $entry = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
          if (-not $entry) { Fail "no Apps & features entry at $key" }
          if ($entry.DisplayVersion -ne $env:VERSION) { Fail "Apps & features says $($entry.DisplayVersion), not $env:VERSION" }
          # The Strom MSI may change PATH for GStreamer; this installer adds nothing to it.
          foreach ($scope in 'Machine', 'User') {
            $entries = [Environment]::GetEnvironmentVariable('Path', $scope) -split ';' | ForEach-Object { $_.TrimEnd('\') }
            if ($entries -contains $dir) { Fail "the install put $dir on the $scope PATH" }
          }

          Write-Host "--- the app's window for 5 s"
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            if (Test-Path -LiteralPath $appLog) { Get-Content -LiteralPath $appLog -Tail 80 }
            Fail "the app exited within 5 s (exit code $($proc.ExitCode))"
          }
          $proc.Refresh()
          Write-Host "the app is running (pid $($proc.Id), main window handle $($proc.MainWindowHandle))"
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path -LiteralPath $webview) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          $webviewMade = Test-Path -LiteralPath $webview
          Stop-Process -Id $proc.Id -Force
          $proc.WaitForExit(15000) | Out-Null
          if (Test-Path -LiteralPath $appLog) { Write-Host "--- app.log (tail)"; Get-Content -LiteralPath $appLog -Tail 20 }
          if (-not $webviewMade) { Fail "WebView2 made no user-data folder at $webview" }
          if (Test-Path -LiteralPath (Join-Path $dir 'open-live-ingest-app.exe.WebView2')) { Fail "WebView2 made its folder next to the app" }

          # The uninstaller copies itself to %TEMP% and runs from there, so wait for the
          # files to go rather than for the process.
          Write-Host "--- silent uninstall"
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "the silent uninstall exited with $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(60)
          while (((Test-Path -LiteralPath $dir) -or (Test-Path -LiteralPath $shortcut)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $app) { Fail "$app is still there after the uninstall" }
          if (Test-Path -LiteralPath $cli) { Fail "$cli is still there after the uninstall" }
          if (Test-Path -LiteralPath $dir) { Fail "$dir is still there after the uninstall" }
          if (Test-Path -LiteralPath $shortcut) { Fail "the shortcut is still there after the uninstall" }
          if (Test-Path -LiteralPath $key) { Fail "the Apps & features entry is still there after the uninstall" }
          if (-not (Test-Path -LiteralPath $strom)) { Fail "the uninstall removed Strom" }
          if (-not (Test-Path -LiteralPath $webview)) { Fail "the uninstall removed the user's WebView2 folder" }
          Write-Host "OK: install, both versions, shortcut, Strom, the app's window and uninstall"
          # GitHub's pwsh wrapper exits with the last native command's code otherwise.
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP }}
          path: ${{ env.SETUP }}
          if-no-files-found: error

  # Runs on the manual trigger too, so a dry run shows the SHA256SUMS a release
  # would carry. It needs no write permission; publishing stays in `release`.
  checksums:
    needs: [build, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The archives of `build` and the installer of `windows-app` only, by name
      # pattern, never a DMG of macos-app.
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.tar.gz
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.zip
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*-setup.exe
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip *-setup.exe > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, windows-app, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only the archives of `build`, the installer of `windows-app` and the SHA256SUMS
      # of `checksums`, each by name. Any other artifact of the run (the DMGs of
      # macos-app) is never downloaded here, so a re-run of this job cannot publish it.
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.tar.gz
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*.zip
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*-setup.exe
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: dist
      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      # Signed build provenance for each archive and the installer, checked with
      # `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Open Live Ingest.app for Apple silicon in a drag-to-install DMG, built from the
  # aarch64-apple-darwin binaries of `build` by .github/scripts/build-macos-app.sh: the
  # desktop app (artifact app-binary-aarch64-apple-darwin) is the bundle's main
  # executable, and the gateway CLI from the tarball sits next to it for SSH use. The
  # script bundles the Strom the strom-types tag in Cargo.toml names, so the workflow
  # never names a Strom version itself.
  #
  # Every Mach-O in the app is signed with the hardened runtime, and strom,
  # open-live-ingest and open-live-ingest-app with the entitlements in
  # .github/scripts/open-live-ingest.entitlements; strom also with
  # com.apple.security.cs.allow-jit, for GStreamer's ORC (#113).
  # The identity depends on the repository secrets (#25):
  #   - APPLE_DEVELOPER_ID_P12 set: its Developer ID Application certificate is imported
  #     into a temporary keychain, which the last step deletes on every outcome, and the
  #     app and the DMG are signed with it and a secure timestamp.
  #   - not set (pull requests, and every run until #25 is done): both are signed ad hoc.
  #     The same hardened-runtime signing and checks run, so a signing or layout problem
  #     shows up now, but the DMG cannot be notarized.
  # Notarizing (notarytool, App Store Connect API key) and stapling run only when the
  # Developer ID certificate and all three APPLE_NOTARY_* secrets are there; otherwise
  # those steps are skipped. Secrets are read only through step env, never echoed.
  #
  # Only a notarized DMG reaches a release. The job output `notarized` is "true" only
  # when "Check the notarization" ran and passed, which needs the Developer ID
  # certificate and the notary key and means notarizing and stapling succeeded; it is
  # "false" on every other run (ad hoc signing, no secrets, any of those steps skipped).
  # Two uploads, each under its own artifact name:
  #   - ${DMG}: a manual run from a branch or a pull request run (workflow_dispatch or
  #     pull_request AND a non-tag ref), whatever the signing, to try the DMG out.
  #   - ${NOTARIZED_DMG_ARTIFACT}: a tag ref with notarized == "true", for `release-macos`.
  # On a tag ref an ad hoc DMG is uploaded under neither name, so nothing can publish
  # it. `release` downloads only the `build` archives by name pattern and never sees a
  # DMG, and `release-macos` runs only when notarized == "true".
  #
  # `release` does not wait for this job, and `release-macos` (which waits for both)
  # only adds to the release `release` created. A failure here or in `release-macos`
  # therefore never holds up or fails the tarballs, SHA256SUMS and attestations; it
  # leaves a release without the DMG, which a re-run of the failed jobs completes.
  macos-app:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      notarized: ${{ steps.notarization.outputs.notarized == 'true' }}
    env:
      TARGET: aarch64-apple-darwin
      APP: Open Live Ingest.app
      # "true" or "false"; secrets cannot be read in `if:` directly.
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && secrets.APPLE_NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}.tar.gz
          path: tarball
      - name: Unpack the gateway
        run: tar xzf "tarball/$BIN-$TARGET.tar.gz" -C tarball
      # An artifact does not keep the executable bit; the script installs it 0755.
      - uses: actions/download-artifact@v4
        with:
          name: app-binary-${{ env.TARGET }}
          path: app-binary

      # The GStreamer the bundle carries, plugins included; see the script's header.
      - name: Install GStreamer
        run: brew install gstreamer

      # A keychain of its own with a random password, first in the search list so
      # codesign finds the identity. KEYCHAIN is exported before anything that can
      # fail, so the cleanup step deletes it whatever happens next.
      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          kc_pw="$(openssl rand -hex 32)"
          echo "::add-mask::$kc_pw"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$kc_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pw" "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          base64 --decode <<<"$P12_BASE64" > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$keychain" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          pattern='"Developer ID Application: .*'
          if [[ -n "$TEAM_ID" ]]; then pattern+="\\($TEAM_ID\\)"; fi
          hash="$(grep -E "$pattern" <<<"$identities" | awk 'NR == 1 { print $2 }')"
          [[ -n "$hash" ]] || { echo "the certificate holds no valid Developer ID Application identity"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Signing with Developer ID identity $hash"

      - name: Say the build is signed ad hoc
        if: env.HAS_DEVELOPER_ID != 'true'
        run: echo "::notice title=Ad hoc signed::APPLE_DEVELOPER_ID_P12 is not set, so the app and the DMG are signed ad hoc (hardened runtime, no Developer ID). This DMG is not notarized; Gatekeeper rejects it once downloaded."

      # dmg-root becomes the DMG's volume: the app and an /Applications link. The script
      # signs with MACOS_SIGN_IDENTITY when the import step set it, ad hoc otherwise,
      # and fails unless every Mach-O carries the hardened runtime and the three
      # executables the camera and microphone entitlements.
      - name: Build and sign the app bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build-macos-app.sh "tarball/$BIN-$TARGET/$BIN" \
            app-binary/open-live-ingest-app dmg-root
          ln -s /Applications dmg-root/Applications

      # hdiutil on hosted runners sometimes fails with "Resource busy"; retry it.
      - name: Build the DMG
        run: |
          for attempt in 1 2 3; do
            hdiutil create -volname "Open Live Ingest" -srcfolder dmg-root \
              -fs HFS+ -format UDZO -ov "$DMG" && exit 0
            echo "hdiutil create failed (attempt $attempt)"
            if (( attempt < 3 )); then sleep 10; fi
          done
          exit 1

      - name: Sign the DMG
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" --keychain "$MACOS_SIGN_KEYCHAIN" "$DMG"
          else
            echo "Signing $DMG ad hoc"
            codesign --force --sign - "$DMG"
          fi
          codesign --verify --strict --verbose=2 "$DMG"

      # The .p8 is written to a private directory and removed when the step ends; the
      # cleanup step removes it too if the runner is cut short.
      - name: Notarize the DMG
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          key="$dir/AuthKey.p8"
          # The secret is the base64 of the .p8 (#25); the PEM text itself works too.
          if [[ "$NOTARY_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          else
            base64 --decode <<<"$NOTARY_KEY_P8" > "$key"
          fi
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit "$DMG" "${auth[@]}" --wait --timeout 1h \
            --output-format json > "$dir/result.json" || true
          status="$(jq -r '.status // empty' "$dir/result.json" 2>/dev/null || true)"
          id="$(jq -r '.id // empty' "$dir/result.json" 2>/dev/null || true)"
          echo "notarytool: submission ${id:-<none>}, status ${status:-<none>}"
          if [[ "$status" != Accepted ]]; then
            if [[ -n "$id" ]]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "notarization did not succeed"; exit 1
          fi

      - name: Staple the notarization ticket
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        run: xcrun stapler staple "$DMG"

      # On every run, on the app as the DMG carries it, mounted away from the build path:
      # - build-macos-app.sh --check: CFBundleExecutable is open-live-ingest-app, with the
      #   CLI and strom next to it and the icon in Resources; no Mach-O load command or
      #   rpath names /opt/homebrew or /usr/local, every Mach-O has the hardened runtime,
      #   strom, open-live-ingest and open-live-ingest-app have the camera and
      #   microphone entitlements, strom alone has com.apple.security.cs.allow-jit, and
      #   the strict deep codesign verify passes.
      # - the signature and entitlements of the main executable, the CLI and strom, for
      #   the log.
      # - the app and the CLI start under the hardened runtime from the mounted DMG
      #   (dyld and library validation load them) and report the bundle's version.
      # - the bundled Strom reports 0.8.1 or later.
      # - the bundled Strom starts under the hardened runtime with the bundle's
      #   GStreamer and GLib environment, as the gateway starts it (LocatedStrom::gst_env
      #   in src/local_strom.rs, mirrored here): the plugin scanner builds the registry
      #   and device discovery answers.
      # - two flows run in it at once, and both must still run 5 s after starting:
      #   a test pattern through videoconvert, videoscale and audioconvert, whose inner
      #   loops are ORC programs, so ORC JITs them (allow-jit, #113); and the gateway's
      #   own test-pattern flow (Source::Test, x264 and the SRT uplink).
      # - with both flows running, the Strom process has no library or module mapped
      #   from outside the app other than macOS's own (lsof: DYLD_PRINT_LIBRARIES is
      #   ignored under the hardened runtime), though this runner has Homebrew's
      #   GStreamer and GLib installed. ORC's JIT buffers (orcexec.* in $HOME or
      #   $TMPDIR) are flagged with a warning annotation, not failed on.
      # - nothing in its log says a library, plugin or GIO module failed to load
      #   (library validation, a bad signature), names a Homebrew path, or says ORC
      #   could not JIT (`ORC: ERROR`, #113).
      - name: Check the DMG
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          strom_pid=""
          trap 'if [[ -n "$strom_pid" ]]; then kill "$strom_pid" 2>/dev/null || true; fi; hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          test -d "$mnt/$APP" || { echo "$APP is missing from the DMG"; exit 1; }
          test "$(readlink "$mnt/Applications")" = /Applications \
            || { echo "the DMG has no /Applications link"; exit 1; }
          contents="$mnt/$APP/Contents"
          .github/scripts/build-macos-app.sh --check "$mnt/$APP"
          codesign -dv --entitlements - "$contents/MacOS/open-live-ingest-app"
          codesign -dv --entitlements - "$contents/MacOS/open-live-ingest"
          codesign -dv --entitlements - "$contents/MacOS/strom"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$contents/Info.plist")"
          for exe in open-live-ingest-app open-live-ingest; do
            got="$("$contents/MacOS/$exe" --version)" \
              || { echo "$exe --version failed from the DMG"; exit 1; }
            echo "bundled $exe: $got"
            test "$got" = "$exe $bundle_version" \
              || { echo "expected '$exe $bundle_version' from $exe --version"; exit 1; }
          done
          otool -L "$contents/MacOS/strom"
          out="$("$contents/MacOS/strom" --version)"
          echo "bundled Strom: $out"
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$out" | head -n 1)"
          IFS=. read -r major minor patch <<<"$version"
          if [[ -z "$version" ]] || (( major == 0 && (minor < 8 || (minor == 8 && patch < 1)) )); then
            echo "the bundled Strom must be 0.8.1 or later (got '$out')"; exit 1
          fi

          data="$RUNNER_TEMP/strom-data"
          mkdir -p "$data"
          log="$data/strom.log"
          port=18080
          GST_PLUGIN_SYSTEM_PATH_1_0="$contents/PlugIns/gstreamer" \
          GST_PLUGIN_SYSTEM_PATH="$contents/PlugIns/gstreamer" \
          GST_PLUGIN_PATH_1_0="" GST_PLUGIN_PATH="" \
          GST_PLUGIN_SCANNER_1_0="$contents/Helpers/gst-plugin-scanner" \
          GST_PLUGIN_SCANNER="$contents/Helpers/gst-plugin-scanner" \
          GST_REGISTRY_1_0="$data/gstreamer-registry.bin" \
          GST_REGISTRY="$data/gstreamer-registry.bin" \
          GIO_MODULE_DIR="$contents/PlugIns/gio" GIO_EXTRA_MODULES="" \
          XDG_DATA_DIRS="$contents/Resources" \
          GST_DEBUG="*:2" \
            "$contents/MacOS/strom" --headless --port "$port" --data-dir "$data" >"$log" 2>&1 &
          strom_pid=$!
          ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$strom_pid" 2>/dev/null; then echo "the bundled Strom exited"; cat "$log"; exit 1; fi
            if curl -fsS -m 5 "http://127.0.0.1:$port/api/version" >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          $ready || { echo "the bundled Strom did not answer within 90s"; cat "$log"; exit 1; }
          echo "Strom version API: $(curl -fsS -m 5 "http://127.0.0.1:$port/api/version")"
          devices="$(curl -fsS -m 60 "http://127.0.0.1:$port/api/discovery/devices?category=video_source")" \
            || { echo "device discovery failed"; cat "$log"; exit 1; }
          echo "Strom device discovery: $devices"

          # ORC's JIT (#113): a test pattern through videoconvert, videoscale and
          # audioconvert, whose inner loops are ORC programs, so ORC compiles them; the
          # flow must start and still run 5 s later (it runs on while the gateway's flow
          # below starts and the lsof check runs), or the log check below proves nothing.
          orc_flow_id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          jq -n --arg id "$orc_flow_id" '
            def el($id; $type; $props; $x; $y):
              {id: $id, element_type: $type, properties: $props, position: [$x, $y]};
            def ln($from; $to): {from: $from, to: $to};
            {
              id: $id, name: "orc-jit-check",
              elements: [
                el("vsrc"; "videotestsrc"; {"is-live": true, pattern: "smpte"}; 0; 0),
                el("vcaps"; "capsfilter";
                   {caps: "video/x-raw,format=I420,width=1280,height=720,framerate=30/1"}; 120; 0),
                el("vconv"; "videoconvert"; {}; 240; 0),
                el("vscale"; "videoscale"; {}; 360; 0),
                el("vout"; "capsfilter"; {caps: "video/x-raw,format=BGRA,width=640,height=360"}; 480; 0),
                el("vsink"; "fakesink"; {}; 600; 0),
                el("asrc"; "audiotestsrc"; {"is-live": true, wave: "sine"}; 0; 150),
                el("acaps"; "capsfilter"; {caps: "audio/x-raw,format=S16LE,rate=48000,channels=2"}; 120; 150),
                el("aconv"; "audioconvert"; {}; 240; 150),
                el("aout"; "capsfilter"; {caps: "audio/x-raw,format=F32LE"}; 360; 150),
                el("asink"; "fakesink"; {}; 480; 150)
              ],
              links: [
                ln("vsrc:src"; "vcaps:sink"), ln("vcaps:src"; "vconv:sink"),
                ln("vconv:src"; "vscale:sink"), ln("vscale:src"; "vout:sink"),
                ln("vout:src"; "vsink:sink"),
                ln("asrc:src"; "acaps:sink"), ln("acaps:src"; "aconv:sink"),
                ln("aconv:src"; "aout:sink"), ln("aout:src"; "asink:sink")
              ]
            }' >"$data/orc-flow.json"
          curl -fsS -m 30 -H 'Content-Type: application/json' --data-binary "@$data/orc-flow.json" \
            "http://127.0.0.1:$port/api/flows" >/dev/null \
            || { echo "the bundled Strom did not take the ORC test-pattern flow"; cat "$log"; exit 1; }
          started="$(curl -fsS -m 60 -X POST "http://127.0.0.1:$port/api/flows/$orc_flow_id/start")" \
            || { echo "the bundled Strom did not start the ORC test-pattern flow"; cat "$log"; exit 1; }
          jq -e '.flow.running == true' <<<"$started" >/dev/null \
            || { echo "the ORC test-pattern flow is not running: $started"; cat "$log"; exit 1; }

          # The flow `up --test` builds (src/flow.rs, Source::Test, default [video]),
          # with a listener uplink so it needs no peer.
          test_flow_id=0f3b6a52-6c1e-4e8a-9d0b-114000000001
          flow_json="$RUNNER_TEMP/test-pattern-flow.json"
          cat >"$flow_json" <<EOF
          {
            "id": "$test_flow_id",
            "name": "dmg-check test pattern",
            "elements": [
              {"id": "testvideo", "element_type": "videotestsrc",
               "properties": {"is-live": true, "pattern": "smpte"}, "position": [0.0, 0.0]},
              {"id": "testvideocaps", "element_type": "capsfilter",
               "properties": {"caps": "video/x-raw,width=1280,height=720,framerate=25/1"}, "position": [120.0, 0.0]},
              {"id": "testaudio", "element_type": "audiotestsrc",
               "properties": {"is-live": true, "wave": "sine", "freq": 1000.0}, "position": [0.0, 150.0]},
              {"id": "testaudiocaps", "element_type": "capsfilter",
               "properties": {"caps": "audio/x-raw,rate=48000,channels=2"}, "position": [120.0, 150.0]}
            ],
            "blocks": [
              {"id": "encoder", "block_definition_id": "builtin.videoenc", "name": "Encoder",
               "properties": {"codec": "h264", "encoder_preference": "auto", "bitrate": 6000,
                              "quality_preset": "ultrafast", "tune": "zerolatency",
                              "rate_control": "cbr", "keyframe_interval": 25},
               "position": {"x": 250.0, "y": 0.0}},
              {"id": "uplink", "block_definition_id": "builtin.mpegtssrt_output", "name": "SRT Uplink",
               "properties": {"srt_uri": "srt://:18090?mode=listener&latency=200", "latency": 200,
                              "num_video_tracks": 1, "num_audio_tracks": 1},
               "position": {"x": 500.0, "y": 0.0}}
            ],
            "links": [
              {"from": "testvideo:src", "to": "testvideocaps:sink"},
              {"from": "testvideocaps:src", "to": "encoder:video_in"},
              {"from": "testaudio:src", "to": "testaudiocaps:sink"},
              {"from": "testaudiocaps:src", "to": "uplink:audio_in_0"},
              {"from": "encoder:encoded_out", "to": "uplink:video_in"}
            ]
          }
          EOF
          api="http://127.0.0.1:$port/api/flows"
          curl -fsS -m 30 -H 'Content-Type: application/json' --data-binary "@$flow_json" "$api" >/dev/null \
            || { echo "creating the test-pattern flow failed"; cat "$log"; exit 1; }
          curl -fsS -m 60 -X POST "$api/$test_flow_id/start" >/dev/null \
            || { echo "starting the test-pattern flow failed"; cat "$log"; exit 1; }
          running=false
          for _ in $(seq 1 30); do
            if [[ "$(curl -fsS -m 5 "$api/$test_flow_id" | jq -r '.flow.running // .running // false')" == true ]]; then
              running=true; break
            fi
            sleep 1
          done
          $running || { echo "the test-pattern flow is not running"; cat "$log"; exit 1; }
          sleep 5
          flow="$(curl -fsS -m 10 "http://127.0.0.1:$port/api/flows/$orc_flow_id")" \
            || { echo "cannot read the ORC test-pattern flow back"; cat "$log"; exit 1; }
          jq -e '.flow.running == true' <<<"$flow" >/dev/null \
            || { echo "the ORC test-pattern flow stopped running: $flow"; cat "$log"; exit 1; }
          echo "OK: the bundled Strom ran the ORC test-pattern flow for 5 s"

          # Every file mapped into Strom (lsof's "txt"): the executable, its libraries,
          # modules it loaded, and the dyld shared cache macOS's own libraries live in.
          # orcexec.* files are ORC's JIT buffers: on macOS ORC (0.4.44) maps a temp file
          # in $HOME twice, writable and executable, even with allow-jit (#113), so they
          # hold code the bundled liborc generated, not code loaded from outside. They
          # are flagged (a warning annotation) and must sit in $HOME or $TMPDIR, but do
          # not fail the check; anything else outside the app and macOS still does.
          app_real="$(cd "$mnt/$APP" && pwd -P)"
          mapped="$(lsof -n -P -p "$strom_pid" -a -d txt -Fn | sed -n 's/^n//p')" \
            || { echo "lsof failed on the bundled Strom"; exit 1; }
          echo "--- files mapped into the bundled Strom ---"; printf '%s\n' "$mapped"
          grep -qE "^($app_real|$mnt/$APP)/Contents/PlugIns/gstreamer/" <<<"$mapped" \
            || { echo "lsof shows no bundled plugin mapped into Strom, so this check saw nothing"; exit 1; }
          outside="$(grep -vE "^($app_real|$mnt/$APP)/|^/usr/lib/|^/System/" <<<"$mapped" \
            | grep -E '/opt/homebrew|/usr/local|\.(dylib|so)$|\.framework/|/orcexec\.' || true)"
          orcexec="$(grep -E '/orcexec\.[^/]*$' <<<"$outside" || true)"
          if [[ -n "$orcexec" ]]; then
            echo "::warning title=ORC JIT buffers mapped into the bundled Strom::$(tr '\n' ' ' <<<"$orcexec")"
            echo "flagged: ORC JIT buffers (orcexec.*) mapped into Strom:"; printf '%s\n' "$orcexec"
            tmp_real="$(cd "${TMPDIR:-/tmp}" 2>/dev/null && pwd -P || echo /private/tmp)"
            stray="$(grep -vE "^($HOME|${TMPDIR%/}|$tmp_real)/orcexec\.[^/]*$" <<<"$orcexec" || true)"
            if [[ -n "$stray" ]]; then
              echo "orcexec.* mapped from outside \$HOME and \$TMPDIR:"; printf '%s\n' "$stray"; exit 1
            fi
            outside="$(grep -vE '/orcexec\.[^/]*$' <<<"$outside" || true)"
          fi
          if [[ -n "$outside" ]]; then
            echo "the bundled Strom loaded these from outside $APP:"; printf '%s\n' "$outside"; exit 1
          fi
          curl -fsS -m 30 -X POST "$api/$test_flow_id/stop" >/dev/null || true
          curl -fsS -m 30 -X POST "$api/$orc_flow_id/stop" >/dev/null || true
          kill "$strom_pid"; wait "$strom_pid" || true; strom_pid=""
          echo "--- strom log (tail) ---"; tail -n 60 "$log"
          test -s "$data/gstreamer-registry.bin" \
            || { echo "the bundled Strom built no GStreamer registry"; exit 1; }
          if grep -nE 'not valid for use in process|Library Validation|Failed to load plugin|Failed to load module|code signature|Code Signature' "$log"; then
            echo "the bundled Strom could not load bundled code under the hardened runtime, or tried to load a GIO module"; exit 1
          fi
          if grep -nE '/opt/homebrew|/usr/local/(lib|opt|Cellar|share)' "$log"; then
            echo "the bundled Strom reached for files of a Homebrew install"; exit 1
          fi
          if grep -nF 'ORC: ERROR' "$log"; then
            echo "ORC could not compile in the bundled Strom: is strom signed with com.apple.security.cs.allow-jit? (#113)"; exit 1
          fi
          echo "OK: no ORC: ERROR in strom.log, ORC's JIT runs under the hardened runtime"
          echo "OK: the bundled Strom runs a test-pattern flow under the hardened runtime with only the bundle's GStreamer and GLib"

      # The last line is what sets the job output `notarized`: it is reached only when
      # notarizing, stapling and both checks here succeeded.
      - name: Check the notarization
        id: notarization
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY_KEY == 'true'
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t install "$DMG"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && github.ref_type != 'tag'
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Upload the notarized DMG for the release
        if: github.ref_type == 'tag' && steps.notarization.outputs.notarized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOTARIZED_DMG_ARTIFACT }}
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Remove the temporary keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/developer-id.p12"
          if [[ -n "${KEYCHAIN:-}" && -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
            echo "Deleted the temporary keychain"
          else
            echo "No temporary keychain to delete"
          fi

  # The no-secret half of the DMG's end to end (#112): the uplink's SRT stats with a
  # receiver that comes up late. The app executable the DMG carries, started with
  # `--ipc-stdio`, is pointed (`self_hosted`) at a stand-in Open Live on loopback and
  # goes live with the test pattern; a local SRT listener (srt-live-transmit, from
  # Homebrew's `srt`) starts at least 30 s later. The uplink's srt-stats are sampled
  # twice, 60 s apart, and the job fails, with the numbers in the log, when
  # packets_sent_dropped grows by more than 1 % of packets_sent (a warning only while
  # E2E_UPLINK_DROP_WARN_ONLY is set, #111), the uplink reports connected=false, sends
  # nothing or reconnects. The check itself is unit tested first
  # (.github/scripts/test_e2e_app.py). What it does: .github/scripts/e2e-app.py
  # (E2E_PART late-listener).
  #
  # Its own job so that it runs on every pull request that builds the DMG, forks
  # included: it reads no secret and touches no shared instance, so it has no fork
  # guard and no `e2e-openlivedev` concurrency group. Never on a tag ref.
  e2e-macos-late-listener:
    needs: macos-app
    if: github.ref_type != 'tag'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP: Open Live Ingest.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DMG }}
      - name: Unit tests of the uplink SRT stats check
        run: python3 -I .github/scripts/test_e2e_app.py
      - name: Install the local SRT listener (srt-live-transmit)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install srt
          command -v srt-live-transmit
      - name: Go live to a stand-in Open Live, late SRT listener, Stop
        env:
          E2E_PART: late-listener
          # The receiver comes up this long after Go live, and the uplink is sampled
          # this many times, this far apart.
          E2E_LATE_SECONDS: "35"
          E2E_SRT_SAMPLES: "2"
          E2E_SRT_INTERVAL: "60"
          # TEMPORARY until #111 (sender drops after a late connect) is fixed: a
          # dropped share above 1 % only warns, with the numbers. connected=false, no
          # packets sent and a reconnect still fail. #111's fix PR removes this line.
          E2E_UPLINK_DROP_WARN_ONLY: "true"
        run: |
          set -euo pipefail
          # As in e2e-macos: drop traffic to the bundled Strom's port (8080) on every
          # interface but loopback before the app can start it.
          sudo pfctl -f /etc/pf.conf
          echo 'block drop in quick on ! lo0 proto { tcp udp } from any to any port 8080' \
            | sudo pfctl -a com.apple/oli-e2e -f -
          sudo pfctl -E 2>&1 | grep -v '^Token' || true
          if ! sudo pfctl -a com.apple/oli-e2e -sr 2>/dev/null | grep -q 'port = 8080'; then
            echo "::error title=e2e app::the pf rule for Strom's port did not load"
            exit 1
          fi
          if ! sudo pfctl -s info 2>/dev/null | grep -q '^Status: Enabled'; then
            echo "::error title=e2e app::pf is not enabled"
            exit 1
          fi
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          python3 -I .github/scripts/e2e-app.py "$mnt/$APP/Contents/MacOS/open-live-ingest-app"
      - name: App log
        if: always()
        run: |
          log="$HOME/Library/Logs/open-live-ingest/app.log"
          if [[ -f "$log" ]]; then cat "$log"; else echo "no app log at $log"; fi
          strom_log="$(find "$HOME/Library/Application Support/open-live-ingest" -name strom.log 2>/dev/null | head -n 1)"
          if [[ -n "$strom_log" ]]; then echo "--- $strom_log (tail) ---"; tail -n 100 "$strom_log"; fi
          srt_log="$RUNNER_TEMP/oli-app-e2e/srt-listener.log"
          if [[ -f "$srt_log" ]]; then echo "--- $srt_log (tail) ---"; tail -n 50 "$srt_log"; fi

  # The agent-run end to end (OL-59i, #100; spec section 14), on the DMG `macos-app`
  # has just built and checked: the app executable the DMG carries, started with
  # `--ipc-stdio` (the app core with no window and no webview), is fed the same
  # messages the page sends, with the test pattern, against the Open Live instance
  # `openlivedev`: Go live, the source in Open Live, Stop, the source and flow gone,
  # Go live again with no 409, quit while live removes them. What it checks and how:
  # .github/scripts/e2e-app.py.
  #
  # The uplink's SRT stats while live (#112): with the secret, the openlivedev
  # production that takes the source is activated at least 30 s after Go live, and
  # the uplink's srt-stats are sampled twice, 60 s apart. The job fails, with the
  # numbers in the log, when packets_sent_dropped grows by more than 1 % of
  # packets_sent (a warning only while E2E_UPLINK_DROP_WARN_ONLY is set, #111) or the
  # uplink reports connected=false. The no-secret variant of the same check is the
  # `e2e-macos-late-listener` job.
  #
  # Needs the repository secret OSC_ACCESS_TOKEN, an Open Source Cloud personal access
  # token for the workspace that owns `openlivedev` (the same secret as the
  # e2e-audio-device workflow). Without it, a run by hand fails and names the secret;
  # a pull request run still starts the DMG's app core, lists devices through the
  # bundled Strom and checks that Go live is refused and quit ends the app, then warns
  # naming the secret and passes. Fork pull requests get no secrets and skip the job.
  #
  # The Windows half runs from the installer once #36 (camera go/no-go on Windows 11)
  # is a go; until then the step summary says so. Never on a tag ref: a release does
  # not wait on a shared test instance. One run at a time per instance, shared with
  # the e2e-audio-device workflow (`e2e-openlivedev`): a third queued run cancels the
  # pending one, which is then re-run by hand.
  e2e-macos:
    needs: macos-app
    if: >-
      github.ref_type != 'tag' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: e2e-openlivedev
      cancel-in-progress: false
    env:
      APP: Open Live Ingest.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DMG }}
      - name: Go live, Stop and quit while live from the DMG, against Open Live
        env:
          OSC_ACCESS_TOKEN: ${{ secrets.OSC_ACCESS_TOKEN }}
          OPEN_LIVE_INSTANCE: openlivedev
          # A run by hand needs the secret; a pull request run without it warns and
          # passes after the checks that need none.
          E2E_REQUIRE_SECRET: ${{ github.event_name == 'workflow_dispatch' }}
          # Everything but the late-listener check, which e2e-macos-late-listener runs.
          E2E_PART: openlivedev
          # The SRT stats check (#112): the receiver comes up this long after Go
          # live, and the uplink is sampled this many times, this far apart.
          E2E_LATE_SECONDS: "35"
          E2E_SRT_SAMPLES: "2"
          E2E_SRT_INTERVAL: "60"
          # TEMPORARY until #111 (sender drops after a late connect) is fixed: a
          # dropped share above 1 % only warns, with the numbers. connected=false, no
          # packets sent and a reconnect still fail. #111's fix PR removes this line.
          E2E_UPLINK_DROP_WARN_ONLY: "true"
        run: |
          set -euo pipefail
          # The bundled Strom the app starts has an unauthenticated API and listens
          # on all interfaces: drop traffic to its port (8080, the default [strom]
          # url) on every interface but loopback before the app can start it, as
          # #83 does with iptables. The script also keeps OSC_ACCESS_TOKEN and
          # GH_TOKEN out of the app's environment, and so out of Strom's.
          sudo pfctl -f /etc/pf.conf
          echo 'block drop in quick on ! lo0 proto { tcp udp } from any to any port 8080' \
            | sudo pfctl -a com.apple/oli-e2e -f -
          sudo pfctl -E 2>&1 | grep -v '^Token' || true
          if ! sudo pfctl -a com.apple/oli-e2e -sr 2>/dev/null | grep -q 'port = 8080'; then
            echo "::error title=e2e app::the pf rule for Strom's port did not load"
            exit 1
          fi
          if ! sudo pfctl -s info 2>/dev/null | grep -q '^Status: Enabled'; then
            echo "::error title=e2e app::pf is not enabled"
            exit 1
          fi
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          trap 'hdiutil detach "$mnt" || hdiutil detach -force "$mnt"' EXIT
          python3 -I .github/scripts/e2e-app.py "$mnt/$APP/Contents/MacOS/open-live-ingest-app"
      - name: Windows
        if: always()
        run: |
          echo "- Windows: not run. The Windows half runs from the installer once #36 (camera capture through Strom on Windows 11) is a go; #36 is not a go yet." >> "$GITHUB_STEP_SUMMARY"
      - name: App log
        if: always()
        run: |
          log="$HOME/Library/Logs/open-live-ingest/app.log"
          if [[ -f "$log" ]]; then cat "$log"; else echo "no app log at $log"; fi
          strom_log="$(find "$HOME/Library/Application Support/open-live-ingest" -name strom.log 2>/dev/null | head -n 1)"
          if [[ -n "$strom_log" ]]; then echo "--- $strom_log (tail) ---"; tail -n 100 "$strom_log"; fi

  # Adds the notarized DMG to the release `release` created: the DMG itself, a
  # SHA256SUMS that covers the release's tarballs, the Windows zip and installer, and the DMG
  # (replacing the one `release` uploaded), and a build-provenance attestation for the DMG, checked with
  # `gh attestation verify open-live-ingest-macos-aarch64.dmg --repo Eyevinn/open-live-ingest`.
  # Skipped, not failed, when macos-app did not notarize (no Apple secrets) or failed,
  # or when `release` failed. The attestation is made before anything is uploaded, so
  # a DMG on a release always has one. Safe to re-run: it checksums the archives as
  # published and uploads with --clobber. --clobber replaces SHA256SUMS by deleting
  # and re-uploading it, so for a moment right after a release the file is missing.
  release-macos:
    if: github.ref_type == 'tag' && needs.macos-app.outputs.notarized == 'true'
    needs: [release, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.NOTARIZED_DMG_ARTIFACT }}
          path: dist
      - name: Checksums for the archives and the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s "dist/$DMG" || { echo "the notarized artifact holds no $DMG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip' --pattern '*-setup.exe' --dir dist
          cd dist
          sha256sum -- *.tar.gz *.zip *-setup.exe "$DMG" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ env.DMG }}
      - name: Add the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "dist/$DMG" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
