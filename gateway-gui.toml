# Desktop app config for the real scenario: Open Live in the cloud.
#
# Note what is NOT here: the local Strom URL (defaults to http://127.0.0.1:8080) and
# the cloud Strom host (discovered from Open Live's server-info).

[gateway]
id = "dev-gateway"
name = "Dev"

[open_live]
url = "http://127.0.0.1:3000"
auth_mode = "direct"
register = true
state_path = "./.dev/gui-state.json"

[log]
level = "info"

[app]
video_resolution = "1280x720"
video_framerate = "25/1"

  [app.video]
  bitrate_kbps = 4000

  [app.uplink]
  mode = "caller"
  port_range = "9200-9300"
