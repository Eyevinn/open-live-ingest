[package]
name = "open-live-gateway"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eyevinn/open-live-gateway"
description = "SDI/UVC contribution gateway for Open Live"

[dependencies]
# Strom's own API types: Flow, BlockInstance, Link, device and SRT statistics
# responses. Pure serde, no GStreamer. Pinned to the Strom release the venue runs;
# bump it on purpose when that Strom is upgraded.
strom-types = { git = "https://github.com/Eyevinn/strom.git", tag = "v0.6.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
# No-echo terminal input for credential prompts. Works on a dumb terminal over SSH.
rpassword = "7"
# Signal 0 liveness checks and SIGTERM for `down`.
libc = "0.2"
# v5 for flow ids derived from gateway id + input id, so nothing has to be stored to
# find a flow again.
uuid = { version = "1", features = ["v5"] }
