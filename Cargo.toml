[workspace]
resolver = "2"
members = ["types", "gateway", "gui"]
default-members = ["gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eyevinn/open-live-gateway"
description = "SDI/UVC contribution gateway for Open Live"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
eframe = "0.36"
# v5 for deterministic flow ids derived from gateway id + input id, so a reboot
# addresses the same Strom flow without consulting local state.
uuid = { version = "1", features = ["serde", "v5"] }
