<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Live Ingest</title>
    <link rel="stylesheet" href="app.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Open Live Ingest</h1>
    </header>
    <main>
      <section id="where" aria-labelledby="where-title">
        <h2 id="where-title">1. Where to send</h2>
      </section>
      <section id="what" class="disabled" aria-labelledby="what-title" aria-disabled="true">
        <h2 id="what-title">2. What to send</h2>
        <label class="show-all"><input type="checkbox" id="show-all"> Show all</label>
        <p id="what-notice" class="notice" hidden></p>
        <table id="inputs">
          <thead>
            <tr><th>Send</th><th>Input</th><th>Audio</th><th>Studio name</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="go" class="disabled" aria-labelledby="go-title" aria-disabled="true">
        <h2 id="go-title">3. Go live</h2>
      </section>
      <p id="problem" class="problem" role="alert" hidden></p>
    </main>
    <footer>
      <span id="version"></span>
    </footer>
  </body>
</html>
